name: Demo Cache Poison (для тестирования)

on:
  pull_request_target:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  poison-demo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      
      - name: Демонстрация отравления кеша
        run: |
          if [ -f .github/scripts/poison-cache.sh ]; then
            bash .github/scripts/poison-cache.sh
          else
            echo "Скрипт отравления не найден"
          fi
      
      - name: Комментарий в PR
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '🔴 **ДЕМО**: Отравление кеша выполнено (симуляция)\n\nCache key: `pnpm-v10-4cb2309f0bae8b1709ae30384d2e0c7ccd190f02b3f477bc78cce8cf91308120`\n\nВ реальной атаке кеш был бы отравлен вредоносным esbuild бинарником.'
            })
